name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Check repository for secrets
        run: npm run check:secrets

      - name: Check types and build
        run: npm run build

      - name: Verify production content policy
        run: npm run check:production-content

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Check Lighthouse, accessibility and internal links (#13)
        run: npm run check:quality-gates

      - name: Upload quality gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-reports
          path: qa-reports/
          retention-days: 30

      - name: Capture visual review evidence (public build only)
        run: npm run capture:visual-evidence

      - name: Upload visual review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: visual-evidence/
          retention-days: 14

      - name: Build preview content (review only, never published)
        run: npm run build
        env:
          CONTENT_PREVIEW: 'true'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
